[package]
name = "nn-spike-candle"
version = "0.1.0"
edition = "2024"
publish = false

# Not a member of the Yu-yu-oh workspace.
[workspace]

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

# candle's random numbers need this to build for the browser
# (with RUSTFLAGS='--cfg getrandom_backend="wasm_js"').
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
