[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/cvar1984/yu-yu-oh"

[workspace.dependencies]
ygo-data = { path = "crates/ygo-data" }
ygo-engine = { path = "crates/ygo-engine" }
ygo-cards = { path = "crates/ygo-cards" }
ygo-ai = { path = "crates/ygo-ai" }
ygo-play = { path = "crates/ygo-play" }
ygo-train = { path = "crates/ygo-train" }
ygo-deckbuilder = { path = "crates/ygo-deckbuilder" }
ygo-server = { path = "crates/ygo-server" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
# The neural network (M6, docs/m6-plan.md: chosen by a trial, owner
# 2026-11-24). Pinned exactly: burn's API changes between minor versions.
burn = { version = "=0.22.1", default-features = false, features = ["std", "flex"] }

[profile.release]
debug = 1

# The WebAssembly build for the browser: small download, no debug info.
[profile.web]
inherits = "release"
debug = false
strip = true
lto = true
codegen-units = 1
