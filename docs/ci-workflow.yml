name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo run -p ygo-cli -- check-data --collection data/collection.json
      - name: Random-play speed (compare with the baseline in CLAUDE.md)
        run: cargo run --release -p ygo-cli -- sim data/decks/owner_main_45.json data/decks/umiiruka_water_40.json -n 2000
