# Playstyles for the heuristic bot. Every style is the same program with
# different weights; `ygo play --bot heuristic:<style>` picks one.
#
# aggression              weight on attacking and on summoning to attack
# lp_weight               value of 100 points of damage dealt to the opponent
# caution                 value of 100 points of damage avoided, and of not
#                         leaving a monster where it will be run over
# tribute_margin          a Tribute Summon must gain at least this much value
#                         over the monsters it tributes
# tribute_needs_cover     Tribute Summon only with a Set Spell or Trap behind it
# counter_min_value       spend a Counter Trap only on a card worth this much
# facedown_attack_min_atk attack a face-down monster only with this much ATK
# use_cost                with lookahead (bot `lookahead:<style>`): activating
#                         a Spell or Trap Card must gain this share of its
#                         worth in the hand
# [<style>.values]        card values that replace those in card_values.toml

schema_version = 1

[styles.beatdown]
aggression = 1.5
lp_weight = 1.0
caution = 0.5
tribute_margin = 5
tribute_needs_cover = false
counter_min_value = 50
facedown_attack_min_atk = 1400
use_cost = 0.5

