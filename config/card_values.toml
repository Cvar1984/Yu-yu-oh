# Card values for the heuristic bots: how much a card is worth to hold,
# keep on the field, or take from the opponent, on a 0 to 100 scale.
# Keys are card ids; `name` is for humans and never checked.
# Seeded from the Python prototype's table (reference/python_prototype).
# A style in styles.toml may override any value.

schema_version = 1

# Cards not listed below.
[defaults]
spell = 30
trap = 30
# A monster is worth monster_base + max(ATK, DEF) / monster_stat_divisor.
monster_base = 10
monster_stat_divisor = 50
# A card the bot cannot identify (face-down or in the opponent's hand).
hidden = 40

# Cards that bring a monster back from a Graveyard at their player's will:
# with lookahead, a monster one of them held could revive counts for the
# style's `revive_worth` share of its worth. `from` is "own" or "either".
# The Shallow Grave is left out: it revives for the opponent too.
[revive]
83764718 = { name = "Monster Reborn", from = "either" }
97077563 = { name = "Call of the Haunted", from = "own" }
70828912 = { name = "Premature Burial", from = "own" }

