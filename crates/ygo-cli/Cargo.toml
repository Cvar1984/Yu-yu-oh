[package]
name = "ygo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line for playing, simulating, training and checking decks"

[lib]
name = "ygo_cli"
path = "src/lib.rs"

[[bin]]
name = "ygo"
path = "src/main.rs"

[dependencies]
ygo-data.workspace = true
ygo-engine.workspace = true
ygo-cards.workspace = true
ygo-ai.workspace = true
clap.workspace = true

[dev-dependencies]
ygo-engine = { workspace = true, features = ["test-support"] }
