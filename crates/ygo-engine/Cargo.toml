[package]
name = "ygo-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic Yu-Gi-Oh! rules engine: state, phases, summons, battle, chains"

[dependencies]
ygo-data.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rand_core = "0.10"
rand_chacha = "0.10"

[features]
# Scenario-test helpers (`ygo_engine::testing`), for this crate's tests and ygo-cards.
test-support = []

[dev-dependencies]
serde_json.workspace = true
proptest = "1"
ygo-engine = { path = ".", features = ["test-support"] }
