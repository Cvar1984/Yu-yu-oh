# House rules read by the engine at game start. Official rules apply wherever
# this file says nothing. Values marked "owner" were confirmed by the owner on
# 2026-11-16; keys marked "open" still await an answer (see CLAUDE.md).
# Changing a value must never need a recompile.

[deck]
main_min = 40
main_max = 60
extra_max = 15          # Fusion monsters
default_copy_limit = 3  # per card; banlist.json overrides

[field]
monster_zones = 5
spell_trap_zones = 5
field_spells_on_field = 1   # owner: 1 on the whole field; a new one destroys the old, whoever owns it

[hand]
max_size = 6                    # owner: no cap during the turn (Pot of Greed may exceed it)
hand_limit_check = "after_draw" # owner: after your Draw Phase, send down to max_size to the GY; "end_phase" = official

[life]
starting_lp = 8000

[turn]
first_player_skips_draw = true      # owner: no draw on turn 1
first_player_can_attack = false     # owner: may summon, Set and activate on turn 1, but not attack
trap_activation_turn_set = true     # owner: a Trap may be activated in the turn it was Set; false = official
spell_target_monster_set_this_turn = false  # owner: a monster Set this turn can't be targeted by a Spell until next turn; true = official

[summon]
normal_or_tribute_per_turn = 1      # Normal Summon, Tribute Summon or Set
tributes_level_5_6 = 1
tributes_level_7_plus = 2
summon_in_main_phase_2 = false      # owner's game
flip_summon_counts_toward_limit = false     # owner: no, may change later
special_summon_counts_toward_limit = false  # owner: no, may change later
max_monsters_entering_per_turn = 0  # 0 = no cap; 1 = owner's earlier strict rule
fusion_summons = true               # owner: Polymerization allowed
ritual_summons = true               # owner: Ritual Spells allowed

[cards]
text_version = "modern"   # owner wants both "modern" and "original_2002" supported; original text data pending
cards = "cards.json"
banlist = "banlist.json"

[win]
deck_out_loses = true     # owner: yes
exodia = true
